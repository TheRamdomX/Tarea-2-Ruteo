<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Resiliencia Internet chilena – Sismo M8.8 27F (2010)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  .info { background: #fff; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.3); font-size: 13px; line-height: 1.4; }
  .info h4 { margin: 0 0 4px; font-size: 14px; }
  .leyenda { background: #fff; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.3); font-size: 12px; line-height: 1.5; }
  .leyenda i { display: inline-block; width: 18px; height: 6px; margin-right: 6px; vertical-align: middle; }
  .punto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .aviso { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff8e1; padding: 12px 16px; border-radius: 6px; z-index: 1000; font-size: 14px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="aviso" class="aviso" style="display:none"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  const map = L.map('map').setView([-35.5, -71.5], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // Colores de p_falla: 0 -> verde, 0.05 amarillo, 0.2 naranja, 0.5 rojo, >=0.8 rojo oscuro.
  function colorFalla(p) {
    if (p == null) return '#999999';
    if (p >= 0.8) return '#67001f';
    if (p >= 0.5) return '#d7191c';
    if (p >= 0.2) return '#fdae61';
    if (p >= 0.05) return '#fee08b';
    return '#1a9850';
  }

  const COLOR_ROL = { genera: '#7b3294', intercambia: '#2166ac', recibe: '#1b9e77' };

  function fmt(x, d) { return x == null ? '-' : Number(x).toFixed(d); }
  function popupProps(props) {
    return Object.keys(props).map(k => '<b>' + k + ':</b> ' + (props[k] == null ? '-' : props[k])).join('<br>');
  }

  const capas = {
    enlaces: L.layerGroup(),
    sinteticos: L.layerGroup(),
    potencial: L.layerGroup(),
    nodos: L.layerGroup(),
    sismo: L.layerGroup(),
    ruptura: L.layerGroup(),
    circulos: L.layerGroup()
  };

  // Nombre de cada grupo mostrado en el control de capas.
  const overlays = {
    'Enlaces de fibra (p_falla)': capas.enlaces,
    'Enlaces sintéticos (gap/acceso)': capas.sinteticos,
    'Infraestructura potencial': capas.potencial,
    'Nodos clave': capas.nodos,
    'Epicentro': capas.sismo,
    'Ruptura estimada': capas.ruptura,
    'Radios 100/200/300 km': capas.circulos
  };
  capas.enlaces.addTo(map);
  capas.sinteticos.addTo(map);
  capas.nodos.addTo(map);
  capas.sismo.addTo(map);
  capas.ruptura.addTo(map);
  capas.circulos.addTo(map);
  // Infraestructura potencial apagada por defecto.

  L.control.layers(null, overlays, { collapsed: false, position: 'topleft' }).addTo(map);

  function cargar(nombre) {
    return fetch('data/' + nombre).then(r => {
      if (!r.ok) throw new Error(nombre + ' (HTTP ' + r.status + ')');
      return r.json();
    });
  }

  function mostrarAviso(msg) {
    const a = document.getElementById('aviso');
    a.textContent = msg;
    a.style.display = 'block';
  }

  Promise.all([
    cargar('enlaces.geojson'),
    cargar('potencial.geojson'),
    cargar('nodos_clave.geojson'),
    cargar('sismo.geojson'),
    cargar('ruptura.geojson'),
    cargar('attr.json')
  ]).then(function (datos) {
    const [enlaces, potencial, nodos, sismo, ruptura, attr] = datos;

    // Enlaces de fibra y sinteticos.
    L.geoJSON(enlaces, {
      filter: f => !f.properties.sintetico,
      style: f => ({ color: colorFalla(f.properties.p_falla), weight: 2 }),
      onEachFeature: (f, layer) => layer.bindPopup(popupProps(f.properties))
    }).addTo(capas.enlaces);

    L.geoJSON(enlaces, {
      filter: f => f.properties.sintetico,
      style: f => ({ color: colorFalla(f.properties.p_falla), weight: 2, dashArray: '6 4' }),
      onEachFeature: (f, layer) => layer.bindPopup(popupProps(f.properties))
    }).addTo(capas.sinteticos);

    // Infraestructura potencial (gris fino, apagada por defecto).
    const potLayer = L.geoJSON(potencial, {
      style: { color: '#888888', weight: 1 },
      onEachFeature: (f, layer) => layer.bindPopup(popupProps(f.properties))
    });
    potLayer.addTo(capas.potencial);
    map.removeLayer(capas.potencial);

    // Nodos clave.
    L.geoJSON(nodos, {
      pointToLayer: (f, latlng) => L.circleMarker(latlng, {
        radius: 7, color: '#222', weight: 1,
        fillColor: COLOR_ROL[f.properties.rol] || '#555', fillOpacity: 0.9
      }),
      onEachFeature: (f, layer) => {
        const p = f.properties;
        layer.bindPopup('<b>' + p.nombre + '</b><br>' + 'cod: ' + p.cod + '<br>rol: ' + p.rol +
          '<br>tipo: ' + p.tipo + '<br>fuente: ' + p.fuente +
          '<br>conectividad antes (operación): ' + fmt(p.conectividad_operacion, 3) +
          '<br>conectividad después (sismo): ' + fmt(p.conectividad_sismo, 3));
      }
    }).addTo(capas.nodos);

    // Epicentro (estrella roja) y ruptura.
    sismo.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const star = L.divIcon({ className: '', html: '<div style="font-size:26px;color:#d00;text-shadow:0 0 3px #fff">&#9733;</div>', iconSize: [26, 26], iconAnchor: [13, 13] });
      const p = f.properties;
      L.marker([lat, lon], { icon: star }).bindPopup('<b>Sismo M' + p.mag + '</b><br>' + p.place +
        '<br>tiempo UTC: ' + p.time + '<br>profundidad: ' + fmt(p.depth_km, 1) + ' km').addTo(capas.sismo);
      [100, 200, 300].forEach(r => {
        L.circle([lat, lon], { radius: r * 1000, color: '#555', weight: 1, dashArray: '2 4', fill: false })
          .bindTooltip(r + ' km').addTo(capas.circulos);
      });
    });

    ruptura.features.forEach(f => {
      L.geoJSON(f, { style: { color: '#000', weight: 3, dashArray: '8 6' } }).addTo(capas.ruptura);
    });

    // Caja de informacion ATTR (arriba a la derecha).
    const info = L.control({ position: 'topright' });
    info.onAdd = function () {
      const div = L.DomUtil.create('div', 'info');
      const op = attr.operacion, sm = attr.sismo;
      div.innerHTML = '<h4>ATTR (conectividad de nodos clave)</h4>' +
        'Operación: <b>' + fmt(op.attr, 4) + '</b> [' + fmt(op.ic95[0], 4) + ', ' + fmt(op.ic95[1], 4) + ']<br>' +
        'Sismo: <b>' + fmt(sm.attr, 4) + '</b> [' + fmt(sm.ic95[0], 4) + ', ' + fmt(sm.ic95[1], 4) + ']<br>' +
        'Diferencia: <b>' + fmt(attr.diferencia_pct, 2) + ' %</b><br>' +
        '<small>' + op.metodo + '</small>';
      return div;
    };
    info.addTo(map);

    // Leyenda (abajo a la derecha).
    const leg = L.control({ position: 'bottomright' });
    leg.onAdd = function () {
      const div = L.DomUtil.create('div', 'leyenda');
      const niveles = [[0, '0'], [0.05, '0.05'], [0.2, '0.2'], [0.5, '0.5'], [0.8, '≥0.8']];
      let h = '<b>p_falla</b><br>';
      [[0, '#1a9850'], [0.05, '#fee08b'], [0.2, '#fdae61'], [0.5, '#d7191c'], [0.8, '#67001f']].forEach((c, i) => {
        h += '<i style="background:' + c[1] + '"></i>' + (i === 0 ? '0' : niveles[i][1]) + '<br>';
      });
      h += '<br><b>Rol de nodo</b><br>';
      Object.keys(COLOR_ROL).forEach(r => {
        h += '<span class="punto" style="background:' + COLOR_ROL[r] + '"></span>' + r + '<br>';
      });
      h += '<br><span style="color:#d00">&#9733;</span> epicentro<br>' +
           '<span style="border-bottom:3px dashed #000;display:inline-block;width:18px"></span> ruptura estimada';
      div.innerHTML = h;
      return div;
    };
    leg.addTo(map);
  }).catch(function (err) {
    console.error(err);
    mostrarAviso('No se pudieron cargar los datos (' + err.message + '). Ejecute: python3 main.py mapa');
  });

  // Titulo sobre el mapa.
  const titulo = L.control({ position: 'topleft' });
  titulo.onAdd = function () {
    const div = L.DomUtil.create('div', 'info');
    div.innerHTML = '<h4>Resiliencia Internet chilena – Sismo M8.8 27F (2010)</h4>';
    return div;
  };
  titulo.addTo(map);
})();
</script>
</body>
</html>
